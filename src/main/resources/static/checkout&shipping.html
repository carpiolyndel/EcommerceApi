<!DOCTYPE html>
<html>
<head>
    <title>Checkout - OFF!®</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/checkout.css">
</head>
<body>
<header>
    <img src="/images/logo.jpg" alt="OFF!® Products Logo">
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/products.html">Products</a></li>
            <li><a href="/cart.html">Cart</a></li>
            <li><a href="/account.html">Account</a></li>
        </ul>
    </nav>
</header>

<main>
    <h1>Checkout</h1>

    <div class="checkout-wrapper">
        <div class="checkout-form-container">
            <section class="shipping">
                <h2>Shipping Address</h2>
                <form id="checkout-form">
                    <fieldset>
                        <legend>Delivery Information</legend>

                        <div class="form-group">
                            <label for="name">Full Name *</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="address">Street Address *</label>
                            <input type="text" id="address" name="address" required>
                        </div>

                        <div class="form-group">
                            <label for="apartment">Apartment, Suite, Unit (Optional)</label>
                            <input type="text" id="apartment" name="apartment">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city" required>
                            </div>

                            <div class="form-group">
                                <label for="province">Province *</label>
                                <input type="text" id="province" name="province" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="zip">Postal Code *</label>
                                <input type="text" id="zip" name="zip" required>
                            </div>

                            <div class="form-group">
                                <label for="country">Country *</label>
                                <select id="country" name="country" required>
                                    <option value="">Select Country</option>
                                    <option value="Philippines">Philippines</option>
                                    <option value="USA">USA</option>
                                    <option value="Canada">Canada</option>
                                    <option value="Australia">Australia</option>
                                </select>
                            </div>
                        </div>
                    </fieldset>

                    <section class="payment">
                        <h2>Payment Method</h2>
                        <div class="payment-options">
                            <div class="payment-option">
                                <label>
                                    <input type="radio" name="payment" value="credit-card" required>
                                    <i class="fas fa-credit-card" style="color: #ff6600; width: 24px;"></i>
                                    <span class="payment-label">Credit Card</span>
                                    <span class="payment-description">Visa, Mastercard, Amex</span>
                                </label>
                            </div>
                            <div class="payment-option">
                                <label>
                                    <input type="radio" name="payment" value="paypal">
                                    <i class="fab fa-paypal" style="color: #0070ba; width: 24px;"></i>
                                    <span class="payment-label">PayPal</span>
                                    <span class="payment-description">Pay with your PayPal account</span>
                                </label>
                            </div>
                            <div class="payment-option">
                                <label>
                                    <input type="radio" name="payment" value="gcash">
                                    <i class="fas fa-mobile-alt" style="color: #28a745; width: 24px;"></i>
                                    <span class="payment-label">GCash / Debit Card</span>
                                    <span class="payment-description">Pay via GCash or Debit Card</span>
                                </label>
                            </div>
                        </div>
                    </section>

                </form>
            </section>
        </div>

        <div class="order-summary">
            <h2>Order Summary</h2>
            <div class="order-items" id="order-items">
                <div class="loading">Loading cart items...</div>
            </div>
            <div class="order-item">
                <span>Subtotal</span>
                <span id="checkout-subtotal">₱0.00</span>
            </div>
            <div class="order-item">
                <span>Shipping</span>
                <span id="checkout-shipping">₱0.00</span>
            </div>
            <div class="order-item">
                <span>Tax (8%)</span>
                <span id="checkout-tax">₱0.00</span>
            </div>
            <div class="order-total">
                <span>Total:</span>
                <span id="checkout-total">₱0.00</span>
            </div>
            <button type="submit" form="checkout-form" class="submit-btn">Place Order</button>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 Carpio & Cebuano® Products. All rights reserved.</p>
</footer>

<div id="message-container"></div>
<script src="/js/script.js"></script>
</body>
</html>
